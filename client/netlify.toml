# Netlify reads this from the base directory (client), so paths are relative to it.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Send every page (e.g. /r/abc123) to the app, which picks the right screen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
